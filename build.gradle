plugins {
    alias(libs.plugins.fabric.loom)
}

base {
    archivesName = properties['archives_base_name'] as String
    version = libs.versions.mod.version.get()
    group = properties['maven_group'] as String
}

loom {
    runs {
        client {
            name "WizHax"
            programArgs "--username", "Wisuazt"
        }
    }
}

repositories {
    maven { url = "https://maven.meteordev.org/releases" }
    maven { url = "https://maven.meteordev.org/snapshots" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://api.modrinth.com/maven" }   // (Xaero, Litematica)
    mavenCentral()
}

dependencies {
    // Fabric
    minecraft(libs.minecraft)
    mappings(variantOf(libs.yarn) { classifier('v2') })
    modImplementation(libs.fabric.loader)
    // Meteor
    modImplementation(libs.meteor.client)

    modCompileOnly "meteordevelopment:baritone:${project.baritone_version}"
    modCompileOnly "maven.modrinth:litematica:${project.litematica_version}"
    modCompileOnly "maven.modrinth:malilib:${project.malilib_version}"
    modCompileOnly "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
    modCompileOnly "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"
    modCompileOnly "maven.modrinth:xaeroplus:${project.xaeroplus_version}"
}

processResources {
    def propertyMap = [
        'version'   : project.version,
        'mc_version': libs.versions.minecraft.get()
    ]

    inputs.properties(propertyMap)

    filteringCharset = 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand(propertyMap)
    }
}

jar {
    inputs.property('archivesName', project.base.archivesName.get())

    from('LICENSE') {
        rename { "${it}_${inputs.properties['archivesName']}" }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-Xlint:deprecation')
    options.compilerArgs.add('-Xlint:unchecked')
}
